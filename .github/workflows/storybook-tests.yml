name: "Component Test Runner"
on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./kvib-react
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright
        working-directory: ./apps/storybook
        run: npx playwright install --with-deps chromium
      # Stories run directly in Vitest browser mode, so no Storybook server is needed.
      # Turbo builds @kvib/react first, since the stories import its dist output.
      - name: Run Storybook tests
        run: npx turbo run test --filter=@kvib/storybook
